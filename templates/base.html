<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}VetClinic{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
      :root {
          --pastel-green: #d2f0da;
          --pastel-pink: #fcdada;
          --dark-text: #4a4a4a;
      }

      body {
          background-color: var(--pastel-green);
          color: var(--dark-text);
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          display: flex;
          flex-direction: column;
          min-height: 100vh;
      }

      .navbar-light .navbar-nav .nav-link,
      .navbar-light .navbar-brand {
          color: var(--dark-text) !important;
          font-weight: 600;
      }

      .navbar-light .navbar-nav .nav-link:hover {
          color: #000000 !important;
      }

      .nav-avatar-placeholder {
          background-color: var(--pastel-pink);
          color: var(--dark-text);
      }

      .card {
          border: none;
          border-radius: 15px;
          background-color: #ffffff;
      }

      .btn-primary {
          background-color: var(--pastel-pink) !important;
          border-color: var(--pastel-pink) !important;
          color: var(--dark-text) !important;
          font-weight: 600;
      }

      .btn-primary:hover {
          filter: brightness(0.95);
      }

      .main-content {
          flex: 1;
      }

      footer ul li {
          transition: transform 0.2s;
      }

      footer ul li:hover {
          transform: translateX(5px);
          color: var(--pastel-pink);
      }
  </style>
</head>
<body>

{% include 'includes/navbar.html' %}

<div class="container mt-5 main-content">
  {% block content %}
  {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

{% block footer %}
  <footer class="mt-auto py-3 border-top text-center text-muted small bg-white w-100">
    <div class="container">
        Emergency: (555) 000-111 | &copy; 2025 VetClinic
    </div>
  </footer>
{% endblock %}

</body>
</html>
